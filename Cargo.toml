[package]
name = "simple-diary"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk4 = { version = "0.10", features = ["v4_10"] }
libc = "0.2"
adw = { version = "0.8", package = "libadwaita", features = ["v1_5"] }
gtkmdeditor = { tag = "v0.2.4", git = "https://github.com/johan-bjareholt/gtkmdeditor" }

[lib]
crate-type = [ "staticlib" ]
